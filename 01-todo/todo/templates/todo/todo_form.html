{% extends 'todo/base.html' %}

{% block content %}
<div class="card">
    <h2 style="margin-top: 0;">{% if form.instance.pk %}Edit Task{% else %}New Task{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">
                {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
            <div style="color: red; font-size: 0.875rem; margin-top: 0.25rem;">{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}
        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">Save Task</button>
            <a href="{% url 'todo_list' %}" class="btn"
                style="background-color: #e5e7eb; color: #374151; margin-left: 0.5rem;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
